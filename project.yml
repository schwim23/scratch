name: Scratch
options:
  bundleIdPrefix: com.schwim23
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K4AUCTTM2J
    CODE_SIGN_STYLE: Automatic
targets:
  Scratch:
    type: application
    platform: iOS
    sources:
      - Scratch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schwim23.scratch
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Scratch records audio so you can capture voice notes."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Scratch transcribes your voice notes to text as you speak, on-device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: scratch
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
  ScratchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ScratchTests
    dependencies:
      - target: Scratch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Scratch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Scratch"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Scratch:
    build:
      targets:
        Scratch: all
        ScratchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScratchTests
